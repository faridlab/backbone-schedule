# =============================================================================
# Domain: schedule
# Entity: ScheduleOrganization
# Description: Org-level schedule assignment with override times.
# =============================================================================

models:
  - name: ScheduleOrganization
    collection: schedule_organizations
    description: "Org-level schedule assignment with override times."

    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]
        description: "Unique schedule organization id"

      structure_id:
        type: uuid?
        attributes: ["@exclude_from_foreign_key_check"]
        description: "# logical FK organization.Structure.id (Structure not yet in org — see module notes)"

      name:
        type: string?
        attributes: ["@length(max=120)"]
        description: "Optional override label"

      order_number:
        type: integer
        attributes: ["@default(0)"]
        description: "Display order"

      start_date:
        type: date?
        description: "Effective from"

      end_date:
        type: date?
        description: "Effective until"

      time_in:
        type: time
        attributes: ["@required"]
        description: "Override shift start"

      time_out:
        type: time
        attributes: ["@required"]
        description: "Override shift end"

      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]
        description: "Audit metadata"

    # No tenancy indexes (ADR-0029): the module is tenant-agnostic. Any per-unit
    # lookups or uniques are installed by the composing service's tenancy
    # decorator, not declared here.
